<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Mood & Connection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,700&display=swap');

        :root {
            --bg: #faf9f6;
            --surface: #ffffff;
            --border: #1a1a1a;
            --text: #1a1a1a;
            --accent: #ff5f1f;
        }

        body.dark-theme {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --border: #333333;
            --text: #f2f2f2;
            --accent: #00ffcc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.5s ease;
        }

        .mood-box {
            background: var(--surface);
            border: 2px solid var(--border);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .mood-box:hover {
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px var(--border);
        }

        .quote-card {
            background: var(--border);
            color: var(--bg);
            clip-path: polygon(0 0, 100% 5%, 100% 100%, 5% 95%);
        }

        input, select {
            background: transparent;
            border: 2px solid var(--border);
            padding: 12px;
            outline: none;
        }

        input:focus { background: white; color: black; }
        
        .glass-form {
            background: var(--surface);
            border: 2px solid var(--border);
            box-shadow: 8px 8px 0px var(--border);
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center">

    <div class="max-w-4xl w-full">
        <!-- Navigation -->
        <nav class="flex justify-between items-center mb-16 border-b-2 border-[#1a1a1a] pb-6">
            <h1 class="text-xl font-bold uppercase tracking-tighter">Atmosphere</h1>
            <select id="theme-select" onchange="updateTheme()" class="text-sm font-bold cursor-pointer">
                <option value="default">Light View</option>
                <option value="dark-theme">Midnight View</option>
            </select>
        </nav>

        <!-- Header -->
        <header class="mb-12">
            <h2 class="text-5xl md:text-6xl font-serif italic font-bold mb-4" style="font-family: 'Fraunces', serif;">How is your heart feeling right now?</h2>
        </header>

        <!-- All 11 Moods Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-16" id="mood-grid">
            <!-- Moods populated by JS -->
        </div>

        <!-- Result Section -->
        <div id="q-card" class="quote-card p-12 md:p-20 text-center mb-24 transition-all duration-500">
            <p id="q-text" class="text-2xl md:text-4xl italic font-serif" style="font-family: 'Fraunces', serif;">Choose a mood to reveal a message for your path.</p>
        </div>

        <!-- Registration Form -->
        <section class="glass-form p-8 md:p-12 rounded-xl mb-24">
            <h3 class="text-3xl font-serif italic mb-4" style="font-family: 'Fraunces', serif;">Stay Connected</h3>
            <p class="mb-8 opacity-70">Register your interest to join the community and receive daily insights.</p>
            
            <form id="registrationForm" class="flex flex-col gap-4">
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-1">Full Name</label>
                    <input type="text" name="name" placeholder="e.g. Alex Smith" required>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-1">Email Address</label>
                    <input type="email" name="email" placeholder="alex@example.com" required>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-1">Area of Interest</label>
                    <select name="interest" class="cursor-pointer">
                        <option>Daily Motivation</option>
                        <option>Mindfulness Tips</option>
                        <option>Early Access</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn" class="bg-black text-white p-4 mt-4 font-bold uppercase tracking-widest hover:bg-orange-600 transition-colors">
                    Submit Interest
                </button>
            </form>
            <p id="formStatus" class="mt-6 text-center font-bold text-green-600 hidden uppercase tracking-widest text-xs">✨ Success! Your information has been saved.</p>
        </section>

        <footer class="pt-8 border-t border-black/10 text-[10px] uppercase font-bold tracking-widest opacity-40 flex justify-between">
            <span>Atmosphere &bull; 2024</span>
            <span>Stay Present</span>
        </footer>
    </div>

    <script>
        // --- GOOGLE SHEETS FORM LOGIC ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwqA6MOrN7kIFMtXKg4Ex_L-79JnKfMnEDr1uUxPi6YoFqPqs1R09RFItA3OtghRCJj/exec'; 
        
        const form = document.getElementById('registrationForm');
        const status = document.getElementById('formStatus');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = 'Sending...';
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    status.classList.remove('hidden');
                    form.reset();
                    btn.innerText = 'Submit Interest';
                    btn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    btn.innerText = 'Error - Try Again';
                    btn.disabled = false;
                });
        });

        // --- MOOD & QUOTES LOGIC ---
        const moods = [
            { id: 'stressed', emoji: '😰', label: 'Stressed' },
            { id: 'sad', emoji: '😢', label: 'Sad' },
            { id: 'unmotivated', emoji: '🔋', label: 'Low Energy' },
            { id: 'angry', emoji: '💢', label: 'Angry' },
            { id: 'excited', emoji: '🤩', label: 'Excited' },
            { id: 'grateful', emoji: '🙏', label: 'Grateful' },
            { id: 'tired', emoji: '😴', label: 'Tired' },
            { id: 'lonely', emoji: '☁️', label: 'Lonely' },
            { id: 'confident', emoji: '💪', label: 'Confident' },
            { id: 'peaceful', emoji: '🌿', label: 'Peaceful' },
            { id: 'anxious', emoji: '😟', label: 'Anxious' }
        ];

        const quotes = {
            stressed: ["Breathe. You are a soul, not a machine.", "Simplify. Focus on the now.", "The storm is outside; keep your center quiet."],
            sad: ["Even the moon has phases.", "Be gentle with your healing.", "This season will yield to spring."],
            unmotivated: ["Small steps count as miles.", "Rest is productive too.", "Do one tiny thing today."],
            angry: ["Transform your fire into light.", "Silence is a power move.", "Don't let others decide your mood."],
            excited: ["Catch the spark!", "Your joy is a magnet for miracles.", "Savor this peak."],
            grateful: ["Focus on the good.", "Gratitude is a superpower.", "What you appreciate, appreciates."],
            tired: ["Sleep is spiritual maintenance.", "It's okay to turn off.", "Give yourself grace to rest."],
            lonely: ["You are a universe within yourself.", "Reach out when you're ready.", "You are more loved than you know."],
            confident: ["You are the architect of your light.", "Walk as if you belong there.", "Trust your instincts."],
            peaceful: ["Everything is exactly as it should be.", "May your heart be calm.", "Flow with the river of life."],
            anxious: ["You are safe in this second.", "Don't believe every story your mind tells.", "Ground yourself in the now."]
        };

        function render() {
            const grid = document.getElementById('mood-grid');
            moods.forEach(m => {
                const d = document.createElement('div');
                d.className = 'mood-box p-6 flex flex-col items-center cursor-pointer';
                d.onclick = () => {
                    const list = quotes[m.id];
                    document.getElementById('q-text').innerText = list[Math.floor(Math.random() * list.length)];
                };
                d.innerHTML = `<span class="text-4xl mb-2">${m.emoji}</span><span class="text-[10px] font-bold uppercase tracking-widest">${m.label}</span>`;
                grid.appendChild(d);
            });
        }

        function updateTheme() { document.body.className = document.getElementById('theme-select').value; }
        window.onload = render;
    </script>
</body>
</html>
