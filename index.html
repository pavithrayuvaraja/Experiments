<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Mood & Connection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,700&display=swap');

        :root {
            --bg: #faf9f6;
            --surface: #ffffff;
            --border: #1a1a1a;
            --text: #1a1a1a;
            --accent: #ff5f1f;
        }

        body.dark-theme {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --border: #333333;
            --text: #f2f2f2;
            --accent: #00ffcc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.5s ease;
        }

        .mood-box {
            background: var(--surface);
            border: 2px solid var(--border);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .mood-box:hover {
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px var(--border);
        }

        .quote-card {
            background: var(--border);
            color: var(--bg);
            clip-path: polygon(0 0, 100% 5%, 100% 100%, 5% 95%);
        }

        input, select {
            background: transparent;
            border: 2px solid var(--border);
            padding: 12px;
            outline: none;
        }

        input:focus { background: white; color: black; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center">

    <div class="max-w-4xl w-full">
        <!-- Nav -->
        <nav class="flex justify-between items-center mb-16 border-b-2 border-[#1a1a1a] pb-6">
            <h1 class="text-xl font-bold uppercase tracking-tighter">Atmosphere</h1>
            <select id="theme-select" onchange="updateTheme()" class="text-sm font-bold">
                <option value="default">Light</option>
                <option value="dark-theme">Midnight</option>
            </select>
        </nav>

        <!-- Mood Section -->
        <header class="mb-12">
            <h2 class="text-5xl md:text-6xl font-serif italic font-bold mb-4" style="font-family: 'Fraunces', serif;">How is your heart feeling?</h2>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-16" id="mood-grid">
            <!-- Moods added by JS -->
        </div>

        <div id="q-card" class="quote-card p-12 md:p-20 text-center mb-24 transition-opacity duration-500">
            <p id="q-text" class="text-2xl md:text-4xl italic font-serif" style="font-family: 'Fraunces', serif;">Choose a mood to begin...</p>
        </div>

        <!-- NEW: Registration Form Section -->
        <section class="border-2 border-black p-10 rounded-xl mb-20 bg-white text-black shadow-[8px_8px_0px_black]">
            <h3 class="text-3xl font-serif italic mb-6" style="font-family: 'Fraunces', serif;">Stay Connected</h3>
            <p class="mb-8 opacity-70">Register your interest to receive daily mindfulness tips.</p>
            
            <form id="registrationForm" class="flex flex-col gap-4">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <select name="interest">
                    <option>Daily Motivation</option>
                    <option>Mindfulness Tips</option>
                    <option>Early Access</option>
                </select>
                <button type="submit" id="submitBtn" class="bg-black text-white p-4 font-bold uppercase hover:bg-orange-600 transition-colors">
                    Submit Interest
                </button>
            </form>
            <p id="formStatus" class="mt-4 text-center font-bold text-green-600 hidden">Success! Your info was saved to the sheet.</p>
        </section>

        <footer class="pt-8 border-t border-black/10 text-[10px] uppercase font-bold tracking-widest opacity-40 flex justify-between">
            <span>Atmosphere &bull; 2024</span>
            <span>Stay Present</span>
        </footer>
    </div>

    <script>
        // --- FORM LOGIC ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwqA6MOrN7kIFMtXKg4Ex_L-79JnKfMnEDr1uUxPi6YoFqPqs1R09RFItA3OtghRCJj/exec';
        const form = document.getElementById('registrationForm');
        const status = document.getElementById('formStatus');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = 'Sending...';
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    status.classList.remove('hidden');
                    form.reset();
                    btn.innerText = 'Submit Interest';
                    btn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    btn.innerText = 'Error - Try Again';
                    btn.disabled = false;
                });
        });

        // --- MOOD LOGIC ---
        const moods = [
            { id: 'stressed', emoji: '😰', label: 'Stressed' },
            { id: 'sad', emoji: '😢', label: 'Sad' },
            { id: 'unmotivated', emoji: '🔋', label: 'Low Energy' },
            { id: 'grateful', emoji: '🙏', label: 'Grateful' }
        ];

        const quotes = {
            stressed: ["Breathe. You are a soul, not a machine.", "Simplify. Focus on the now."],
            sad: ["Even the moon has phases.", "Be gentle with your healing."],
            unmotivated: ["Small steps count as miles.", "Rest is productive too."],
            grateful: ["Focus on the good.", "Gratitude is a superpower."]
        };

        function render() {
            const grid = document.getElementById('mood-grid');
            moods.forEach(m => {
                const d = document.createElement('div');
                d.className = 'mood-box p-6 flex flex-col items-center cursor-pointer';
                d.onclick = () => {
                    document.getElementById('q-text').innerText = quotes[m.id][Math.floor(Math.random() * 2)];
                };
                d.innerHTML = `<span class="text-4xl mb-2">${m.emoji}</span><span class="text-[10px] font-bold uppercase">${m.label}</span>`;
                grid.appendChild(d);
            });
        }

        function updateTheme() { document.body.className = document.getElementById('theme-select').value; }
        window.onload = render;
    </script>
</body>
</html>
